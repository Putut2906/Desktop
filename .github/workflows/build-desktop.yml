# Membangun versi desktop: Windows (.exe installer, .msi, dan folder portabel), macOS (.dmg), Linux (.deb).
# jpackage tidak bisa lintas-OS, jadi setiap format dibangun di runner OS-nya sendiri.
# Terpisah dari build-release.yml (APK Android) dan hanya jalan saat berkas terkait desktop berubah.
# Catatan: memicu ulang rilis Desktop cukup ubah komentar baris ini lalu push ke main.
name: Build Desktop

on:
  workflow_dispatch:
  push:
    paths:
      - 'desktop/**'
      - 'app/src/main/java/com/example/web/**'
      - 'app/src/main/java/com/example/data/**'
      - 'app/src/main/assets/web/**'
      - '.github/workflows/build-desktop.yml'

permissions:
  contents: write

jobs:
  package:
    name: Paket ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            tasks: packageExe packageMsi
            artifact_path: |
              desktop/build/compose/binaries/main/exe/*.exe
              desktop/build/compose/binaries/main/msi/*.msi
          - name: macOS
            os: macos-latest
            tasks: packageDmg
            artifact_path: desktop/build/compose/binaries/main/dmg/*.dmg
          - name: Linux
            os: ubuntu-latest
            tasks: packageDeb
            artifact_path: desktop/build/compose/binaries/main/deb/*.deb
    defaults:
      run:
        shell: bash
        working-directory: desktop

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Windows: versi portabel dulu (tanpa WiX), supaya "My Singghara.exe" tetap ada
      # walaupun langkah installer di bawah gagal karena WiX belum terpasang di runner.
      - name: Build versi portabel (Windows)
        if: matrix.name == 'Windows'
        run: ./gradlew createDistributable -PappVersionName=1.0.${{ github.run_number }} --no-daemon

      - name: Unggah versi portabel (Windows)
        if: matrix.name == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: my-singghara-desktop-Windows-portable
          path: desktop/build/compose/binaries/main/app/
          if-no-files-found: error

      - name: Build installer
        run: ./gradlew ${{ matrix.tasks }} -PappVersionName=1.0.${{ github.run_number }} --no-daemon --stacktrace

      # Diagnostik: saat build installer gagal, munculkan ekor log Gradle/jpackage sebagai
      # annotation ("::error::") supaya bisa dibaca tanpa hak admin, lalu lanjutkan agar
      # artefak yang sudah ada tetap terunggah.
      - name: Tampilkan ekor log bila build installer gagal
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          echo "Perintah yang dijalankan: ./gradlew ${{ matrix.tasks }} -PappVersionName=1.0.${{ github.run_number }} --no-daemon --stacktrace"
          LOG="$(find . -path '*/compose/logs/*' -type f 2>/dev/null | head -n 1 || true)"
          if [ -n "$LOG" ]; then
            echo "Log jpackage: $LOG"
            MSG="$(tail -n 40 "$LOG" | sed 's/%/%25/g; s/\r/%0D/g; s/"/%22/g; s/#/%23/g' | tr '\n' '|' | sed 's/|/%0A/g')"
          else
            MSG="Log jpackage tidak ditemukan; lihat Gradle --stacktrace di log mentah langkah Build installer."
          fi
          echo "::error::[desktop ${{ matrix.name }}] $MSG"

      - name: Unggah log diagnostik (bila gagal)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.name }}-build-log
          path: |
            desktop/build/compose/logs
            desktop/build/reports
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: my-singghara-desktop-${{ matrix.name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error

  # Menerbitkan GitHub Release dari artefak build-desktop yang sukses, memakai
  # GITHUB_TOKEN bawaan Actions (tidak perlu login gh lokal). Pola mengikuti
  # build-release.yml Android: tag v1.0.<run_number>, changelog dari git log.
  release:
    name: Terbitkan Release
    needs: package
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Unduh semua artefak desktop
        uses: actions/download-artifact@v4
        with:
          pattern: my-singghara-desktop-*
          path: dl
          merge-multiple: false

      - name: Rakit aset rilis (installer + portable zip)
        run: |
          set -euo pipefail
          TAG="v1.0.${{ github.run_number }}"
          mkdir -p release-assets
          # File installer tunggal per platform (exe, msi, deb, dmg) — struktur folder
          # artefak bisa berbeda-beda, jadi cari rekursif berdasarkan ekstensi.
          # Kecualikan isi folder portabel "My Singghara/" (launcher .exe internal di
          # dalamnya sudah dibundel ke zip portable, bukan installer lepas).
          find dl -type f \( -iname '*.exe' -o -iname '*.msi' -o -iname '*.deb' -o -iname '*.dmg' \) \
            -not -path '*/My Singghara/*' \
            -exec cp -v {} release-assets/ \;
          # Versi portabel Windows = folder aplikasi "My Singghara" hasil createDistributable.
          PORT_DIR="$(find dl -type d -name 'My Singghara' | head -n 1 || true)"
          if [ -n "$PORT_DIR" ]; then
            ( cd "$(dirname "$PORT_DIR")" && zip -rq "$GITHUB_WORKSPACE/release-assets/MySingghara-${TAG}-Windows-portable.zip" "$(basename "$PORT_DIR")" )
            echo "Dibuat: MySingghara-${TAG}-Windows-portable.zip"
          else
            echo "Peringatan: folder portabel 'My Singghara' tidak ditemukan."
          fi
          echo "=== Isi release-assets ==="
          ls -lh release-assets/

      - name: Generate tag & changelog
        id: vars
        run: |
          RUN_NUM="${{ github.run_number }}"
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          TAG_NAME="v1.0.${RUN_NUM}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log ${PREV_TAG}..HEAD --oneline --no-merges)
          else
            CHANGELOG=$(git log -n 10 --oneline --no-merges)
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "short_sha=$SHORT_SHA" >> "$GITHUB_OUTPUT"
          echo "changelog<<EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$CHANGELOG" ]; then
            echo "- Pembaruan build desktop (Build #${RUN_NUM})" >> "$GITHUB_OUTPUT"
          else
            echo "$CHANGELOG" | sed 's/^/- /' >> "$GITHUB_OUTPUT"
          fi
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Terbitkan GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.vars.outputs.tag_name }}
          name: My Singghara Desktop ${{ steps.vars.outputs.tag_name }}
          body: |
            ## 🖥️ My Singghara Desktop ${{ steps.vars.outputs.tag_name }}

            Dibangun otomatis via GitHub Actions (Windows .exe/.msi + portabel, macOS .dmg, Linux .deb).

            ### 📝 Catatan Pembaruan (Changelog):
            ${{ steps.vars.outputs.changelog }}

            ---
            - **Commit SHA**: `${{ steps.vars.outputs.short_sha }}`
            - **Build Number**: `${{ github.run_number }}`

            ### 📥 Unduh:
            Pilih berkas sesuai sistem operasi Anda di bagian **Assets** di bawah.
          draft: false
          prerelease: false
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
